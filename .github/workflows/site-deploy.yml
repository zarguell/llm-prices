name: Build & Deploy static site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '50 13 * * 1'   # weekly rebuild after the Monday snapshot commit (13:30 UTC)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install generator deps
        run: pip install jinja2
      - name: Snapshot contract tests
        run: python engine/test_snapshot.py
      - name: SSG contract tests
        run: python engine/test_ssg.py
      - name: Build the static site
        run: python engine/ssg.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
